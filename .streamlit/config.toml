# Server binding is managed by the host (Streamlit Cloud, or the $PORT flag in
# Procfile / render.yaml), so it's intentionally not hardcoded here.
[server]
headless = true

[theme]
primaryColor = "#F59E0B"
backgroundColor = "#0c0a09"
secondaryBackgroundColor = "#12100d"
textColor = "#FAF5EF"
font = "sans serif"

[browser]
gatherUsageStats = false
