# Server binding is managed by the host (Streamlit Cloud, or the $PORT flag in
# Procfile / render.yaml), so it's intentionally not hardcoded here.
[server]
headless = true

# Light by default; the in-app "Dark mode" toggle restyles the custom UI.
[theme]
base = "light"
primaryColor = "#D97706"
backgroundColor = "#f6f3ee"
secondaryBackgroundColor = "#efeae2"
textColor = "#1c1917"
font = "sans serif"

[browser]
gatherUsageStats = false
